<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>活動報到</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@700&display=swap">
<style>
/* 報到頁：手機直式，與前台同一組配色 token；文字一律深色 */
:root {
  --bg: #FFF5F3; --surface: #FFFFFF; --primary: #F6B8C6; --secondary: #B9E2D3;
  --ink: #3E3236; --ink-soft: #6E5A60; --line: #EADCDF; --bad: #B5481C;
  --f-display: "Huninn", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-num: "Nunito", "Noto Sans TC", sans-serif;
}
:root[data-palette="mint"] { --bg: #F3FAF6; --primary: #A6DCC8; --secondary: #FFE3A1; --ink: #293F3A; --ink-soft: #4F6660; --line: #D6E8E0; }
:root[data-palette="lavender"] { --bg: #F6F4FB; --primary: #C9BCEB; --secondary: #B5D3F0; --ink: #312E45; --ink-soft: #595570; --line: #E0DCEE; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 17px/1.6 var(--f-body); -webkit-font-smoothing: antialiased;
  padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
}
main { max-width: 440px; margin: 0 auto; }
header { text-align: center; margin: 8px 0 24px; }
h1 { margin: 0; font: 400 32px/1.25 var(--f-display); letter-spacing: 0.03em; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--ink-soft); font-size: 15px; }
.card {
  background: var(--surface); border-radius: 24px; padding: 28px 22px;
  box-shadow: 0 10px 28px rgba(62, 50, 54, 0.08);
}
label { display: block; font-weight: 700; margin-bottom: 10px; }
input {
  width: 100%; font: 700 26px/1.2 var(--f-num); letter-spacing: 0.06em; color: var(--ink);
  padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface);
  outline: none; text-align: center;
}
input:focus { border-color: var(--primary); }
.err { color: var(--bad); font-weight: 500; margin: 10px 0 0; text-align: center; }
.btns { display: grid; gap: 12px; margin-top: 20px; }
button {
  font: 700 19px var(--f-body); color: var(--ink); border: 0; border-radius: 999px;
  padding: 15px 18px; min-height: 56px; background: var(--primary); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  -webkit-tap-highlight-color: transparent;
}
button.ghost { background: transparent; color: var(--ink-soft); font-weight: 500; font-size: 16px; min-height: 44px; padding: 8px; }
button:disabled { opacity: 0.75; cursor: default; }
.spin {
  width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(0, 0, 0, 0.15);
  border-top-color: var(--ink); animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.slow { margin: 14px 0 0; text-align: center; color: var(--ink-soft); font-size: 15px; }
.who { text-align: center; }
.who .nm { font: 400 34px/1.3 var(--f-display); }
.who .unit { color: var(--ink-soft); font-size: 18px; }
.elig {
  display: inline-block; margin-top: 14px; padding: 6px 18px; border-radius: 999px;
  background: var(--secondary); font-weight: 700;
}
.elig.no { background: var(--line); font-weight: 500; }
.done { text-align: center; }
.done .big { font: 700 28px/1.3 var(--f-body); margin: 0 0 4px; }
.done .event { font: 400 22px/1.3 var(--f-display); color: var(--ink-soft); margin: 0 0 20px; }
.done .time { margin-top: 16px; color: var(--ink-soft); }
.done .time b { font: 700 30px var(--f-num); color: var(--ink); margin-left: 6px; }
.done .shot { margin-top: 18px; font-size: 14px; color: var(--ink-soft); }
.msg { text-align: center; font: 500 20px/1.5 var(--f-body); padding: 12px 0; }
.center { text-align: center; color: var(--ink-soft); padding: 24px 0; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><p class="sub" id="sub" hidden></p></header>
  <section class="card" id="view" aria-live="polite"><div class="center">載入中…</div></section>
</main>
<script>
(() => {
'use strict';

const API_VERSION = 1;
const PALETTE_KEYS = { primary: '--primary', secondary: '--secondary', bg: '--bg', ink: '--ink' };
const DEFAULT_TEXTS = {
  success: '報到成功', eligible: '具抽獎資格', ineligible: '本次無抽獎資格', closed: '報到已截止',
  notFound: '查無此工號，請至報到處', prep: '系統準備中，請稍後再試', ended: '活動已結束', screenshot: '請截圖保存',
};
const NET_FAIL = '目前連線不穩，請稍後重新掃描 QR code';
const SLOW = '人潮較多，正在為您排隊，請勿關閉此頁面';

const $view = document.getElementById('view');
const deployId = new URLSearchParams(location.search).get('e') || '';
const API = 'https://script.google.com/macros/s/' + encodeURIComponent(deployId) + '/exec';
let cfg = null;
let T = DEFAULT_TEXTS;

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 與 GAS 端相同：去空白、全形轉半形、英文轉大寫
function normId(s) {
  return String(s || '')
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[\s　]/g, '')
    .toUpperCase();
}

// ── 呼叫 GAS：失敗時以隨機間隔重試（1～3 秒起逐次拉長），最多約 30 秒 ──
async function fetchOnce(params, post, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = post
      ? await fetch(API, { method: 'POST', body: JSON.stringify(params), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal })
      : await fetch(API + '?' + new URLSearchParams(params), { signal: ctrl.signal });
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function call(params, { post = false, onSlow } = {}) {
  const deadline = Date.now() + 30000;
  const slowTimer = onSlow ? setTimeout(onSlow, 3000) : null;
  let wait = 1000 + Math.random() * 2000;
  try {
    for (;;) {
      const left = deadline - Date.now();
      if (left < 1500) throw new Error('timeout');
      try {
        const data = await fetchOnce(params, post, Math.min(15000, left));
        if (data && (data.ok || data.code !== 'error')) return data;
      } catch (e) { /* 網路錯誤或不是 JSON，重試 */ }
      if (Date.now() + wait > deadline) throw new Error('timeout');
      await sleep(wait);
      wait = Math.min(wait * 1.6, 8000) * (0.8 + Math.random() * 0.4);
    }
  } finally {
    clearTimeout(slowTimer);
  }
}

// ── 畫面 ───────────────────────────────────────────
function render(html) { $view.innerHTML = html; }

function showMessage(text, retry) {
  render(`<p class="msg">${esc(text)}</p>` + (retry ? `<div class="btns"><button class="ghost" type="button" id="again">重新輸入</button></div>` : ''));
  if (retry) document.getElementById('again').onclick = () => showInput('');
}

function showInput(value, error) {
  render(`
    <form id="f" novalidate>
      <label for="id">請輸入工號</label>
      <input id="id" name="id" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" value="${esc(value)}">
      ${error ? `<p class="err">${esc(error)}</p>` : ''}
      <div class="btns"><button type="submit" id="go">下一步</button></div>
      <p class="slow" id="slow" hidden>${esc(SLOW)}</p>
    </form>`);
  const input = document.getElementById('id');
  input.focus();
  document.getElementById('f').onsubmit = e => { e.preventDefault(); lookup(input.value); };
}

function busyButton(btn, text) {
  btn.disabled = true;
  btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${esc(text)}`;
}

function eligHTML(eligible) {
  return eligible ? `<span class="elig">✓ ${esc(T.eligible)}</span>` : `<span class="elig no">${esc(T.ineligible)}</span>`;
}

function whoHTML(r) {
  return `<div class="who"><div class="nm">${esc(r.name)}</div><div class="unit">（${esc(r.unit)}）</div>${eligHTML(r.eligible)}</div>`;
}

function showConfirm(r) {
  render(`
    ${whoHTML(r)}
    <div class="btns">
      <button type="button" id="ok">確認報到</button>
      <button type="button" class="ghost" id="no">不是我，重新輸入</button>
    </div>
    <p class="slow" id="slow" hidden>${esc(SLOW)}</p>`);
  document.getElementById('ok').onclick = () => checkin(r);
  document.getElementById('no').onclick = () => showInput('');
}

function showDone(r, already) {
  document.title = '報到完成';
  render(`
    <div class="done">
      <p class="big">${already ? `您已於 ${esc(r.time)} 完成報到` : '✅ ' + esc(T.success)}</p>
      <p class="event">${esc(cfg.title)}</p>
      <div class="who"><div class="nm">${esc(r.name)}</div><div class="unit">（${esc(r.unit)}）</div></div>
      <div class="time">報到時間<b>${esc(r.time)}</b></div>
      ${eligHTML(r.eligible)}
      <p class="shot">${esc(T.screenshot)}</p>
    </div>`);
}

function handleResult(r, typed) {
  switch (r.result) {
    case 'prep': return showMessage(T.prep);
    case 'ended': return showMessage(T.ended);
    case 'closed': return showMessage(T.closed, true);
    case 'notFound': return showInput(typed, T.notFound);
    case 'done': return showDone(r, false);
    case 'already': return showDone(r, true);
    case 'found': return r.time ? showDone(r, true) : showConfirm(r);
    default: return showMessage(NET_FAIL);
  }
}

// ── 流程 ───────────────────────────────────────────
async function lookup(raw) {
  const id = normId(raw);
  if (!id) return showInput('', '請輸入工號');
  busyButton(document.getElementById('go'), '查詢中…');
  try {
    const r = await call({ a: 'lookupId', id }, { onSlow: () => { document.getElementById('slow').hidden = false; } });
    handleResult(r, raw);
  } catch (e) {
    showMessage(NET_FAIL);
  }
}

async function checkin(person) {
  busyButton(document.getElementById('ok'), '報到中…');
  document.getElementById('no').hidden = true;
  try {
    const r = await call({ a: 'checkin', id: person.id }, { post: true, onSlow: () => { document.getElementById('slow').hidden = false; } });
    handleResult(r, person.id);
  } catch (e) {
    showMessage(NET_FAIL);
  }
}

function applyConfig(c) {
  T = Object.assign({}, DEFAULT_TEXTS);
  Object.keys(c.texts || {}).forEach(k => { if (c.texts[k]) T[k] = c.texts[k]; });
  const root = document.documentElement;
  const theme = c.theme || {};
  if (theme.palette && theme.palette !== 'strawberry') root.dataset.palette = theme.palette;
  Object.keys(PALETTE_KEYS).forEach(k => { if (theme.colors && theme.colors[k]) root.style.setProperty(PALETTE_KEYS[k], theme.colors[k]); });
  const font = theme.font || 'Huninn';
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(font).replace(/%20/g, '+') + '&display=swap';
  document.head.appendChild(link);
  root.style.setProperty('--f-display', `"${font.replace(/"/g, '')}", "Noto Sans TC", "Microsoft JhengHei", sans-serif`);
  if (c.title) {
    document.getElementById('title').textContent = c.title;
    document.title = c.title + '｜報到';
  }
  if (c.subtitle) {
    const sub = document.getElementById('sub');
    sub.textContent = c.subtitle; sub.hidden = false;
  }
}

async function start() {
  if (!/^[\w-]{20,}$/.test(deployId)) return showMessage('連結不完整，請重新掃描 QR code');
  render(`<div class="center"><span class="spin" style="display:inline-block;vertical-align:middle"></span> 載入中…</div><p class="slow" id="slow" hidden>${esc(SLOW)}</p>`);
  try {
    cfg = await call({ a: 'config' }, { onSlow: () => { document.getElementById('slow').hidden = false; } });
  } catch (e) {
    return showMessage(NET_FAIL);
  }
  if (!cfg.ok) return showMessage(NET_FAIL);
  if (cfg.apiVersion !== API_VERSION) return showMessage(`此活動需使用 /v${cfg.apiVersion}/ 網址，請洽報到處`);
  applyConfig(cfg);
  if (cfg.state === '準備中') return showMessage(T.prep);
  if (cfg.state === '已結束') return showMessage(T.ended);
  showInput('');
}

start();
})();
</script>
</body>
</html>
