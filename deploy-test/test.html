<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>部署測試</title>
<style>
  body { margin: 0; padding: 24px 16px; font: 16px/1.6 "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #FFF5F3; color: #3E3236; }
  main { max-width: 560px; margin: 0 auto; }
  input, button { font: inherit; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 1px solid #ccb; margin-top: 8px; }
  button { background: #F6B8C6; border: 0; color: #3E3236; font-weight: 700; }
  pre { white-space: pre-wrap; word-break: break-all; background: #fff; padding: 12px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>GAS 部署測試</h1>
  <p>貼上部署作業 ID 或網頁應用程式網址，分別測試 GET 與 POST（text/plain）。請用手機無痕視窗開這一頁。</p>
  <input id="dep" placeholder="AKfycb… 或 https://script.google.com/macros/s/…/exec">
  <button id="go" type="button">測試</button>
  <pre id="out"></pre>
</main>
<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search).get('e');
if (q) $('dep').value = q;
function execUrl(v) {
  v = v.trim();
  const m = v.match(/\/s\/([\w-]+)\//);
  return 'https://script.google.com/macros/s/' + (m ? m[1] : v) + '/exec';
}
$('go').onclick = async () => {
  const url = execUrl($('dep').value);
  const out = $('out');
  out.textContent = '測試中…';
  const lines = [];
  for (const [name, opt, qs] of [
    ['GET', {}, '?q=hello'],
    ['POST', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ id: '000123' }) }, ''],
  ]) {
    const t0 = performance.now();
    try {
      const res = await fetch(url + qs, opt);
      const text = await res.text();
      let ok = false;
      try { ok = JSON.parse(text).ok === true; } catch (e) { /* 不是 JSON */ }
      lines.push(`${ok ? '✅' : '❌'} ${name}　${Math.round(performance.now() - t0)} ms\n${text.slice(0, 300)}`);
    } catch (e) {
      lines.push(`❌ ${name}　${e.message}（通常是存取權不是「任何人」，被導去登入頁）`);
    }
    out.textContent = lines.join('\n\n');
  }
};
</script>
</body>
</html>
