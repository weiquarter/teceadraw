<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>摸彩前台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@700&display=swap">
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="stage" aria-live="polite"></div>
<div id="black" hidden></div>
<div id="blocker" hidden></div>
<div id="banner" hidden></div>
<div id="toast"></div>
<div id="status" hidden></div>
<div id="sync" hidden></div>
<div id="focusDot" hidden title="點一下畫面，鍵盤才會有反應"></div>
<aside id="help" hidden>
  <h2>按鍵說明</h2>
  <table>
    <tr><td><kbd>→</kbd> <kbd>空白</kbd> <kbd>PgDn</kbd></td><td>下一頁、抽獎、補抽</td></tr>
    <tr><td><kbd>←</kbd> <kbd>PgUp</kbd></td><td>上一頁；在主頁時回看已完成的獎項</td></tr>
    <tr><td><kbd>X</kbd> → 數字 → <kbd>Enter</kbd></td><td>作廢／取消作廢指定格子（<kbd>0</kbd>＝第 10 格，<kbd>Esc</kbd> 取消）</td></tr>
    <tr><td><kbd>B</kbd></td><td>黑畫面</td></tr>
    <tr><td><kbd>F</kbd></td><td>全螢幕</td></tr>
    <tr><td><kbd>?</kbd></td><td>顯示或隱藏這個說明與狀態列</td></tr>
  </table>
</aside>

<script src="../vendor/qrcode.js"></script>
<script src="sync.js"></script>
<script>
(() => {
'use strict';

const PALETTES = { strawberry: '草莓牛奶', mint: '薄荷檸檬', lavender: '薰衣草藍莓' };
const PAGE_NAMES = { home: '主頁', prize: '獎項頁', draw: '抽獎頁', recall: '回看' };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const E = params.get('e') || '';
const K = params.get('k') || '';
const API = 'https://script.google.com/macros/s/' + encodeURIComponent(E) + '/exec';

const $stage = document.getElementById('stage');
const $black = document.getElementById('black');
const $blocker = document.getElementById('blocker');
const $banner = document.getElementById('banner');
const $toast = document.getElementById('toast');
const $status = document.getElementById('status');
const $sync = document.getElementById('sync');
const $help = document.getElementById('help');
const $focusDot = document.getElementById('focusDot');

// ── 狀態 ───────────────────────────────────────────────
// M：從後端載入、以操作紀錄推導出的抽獎狀態；U：畫面狀態
const M = {
  loaded: false, version: 0, prizeChanged: false, versionMismatch: false,
  prizes: [], people: [], byId: {}, ops: [], opIds: new Set(),
  slots: [], done: [], completed: [], used: new Set(), recallLocked: false,
};
const U = {
  page: 'home', cur: 0, recallPos: 0, voidSel: null, busy: 0, black: false, help: false,
  sysState: '', checkins: 0, nextPrizeName: '', blocked: '', assets: { total: 0, done: 0, failed: 0 },
};
const ASSET = { home: '', prize: '', draw: '', logo: '', photo: {} };
let cfg = { title: '', subtitle: '', theme: {} };

const Sync = createSync({
  e: E, k: K,
  version: () => M.version,
  report: () => ({ page: PAGE_NAMES[U.page] || U.page, prize: U.page === 'home' ? '' : (curPrize() || {}).name || '' }),
});

// ── 工具 ───────────────────────────────────────────────
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastTimer;
function toast(msg, ms) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), ms || 2200);
}
function scale() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  $stage.dataset.s = s;
}

// ── 亂數：crypto.getRandomValues＋拒絕取樣，每人機率相等 ──
function randInt(n) {
  const limit = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
  return x % n;
}
function available() { return M.people.filter(p => !M.used.has(p.id)); }
function pick(n) {
  const pool = available();
  const out = [];
  for (let i = 0; i < n; i++) out.push(pool.splice(randInt(pool.length), 1)[0]);
  return out;
}
// 滾動畫面用的名字只是動畫，與結果無關
function rollName() {
  const src = available();
  const list = src.length ? src : M.people;
  return list[Math.floor(Math.random() * list.length)] || { unit: '', name: '…', tag: '' };
}

// ── 操作紀錄 → 抽獎狀態 ────────────────────────────────
function resetModel() {
  M.slots = M.prizes.map(p => Array.from({ length: p.qty }, () => ({ state: 'empty', person: null, history: [], redrawn: false })));
  M.done = M.prizes.map(() => false);
  M.completed = [];
  M.used = new Set();
  M.recallLocked = false;
}
function applyOp(op) {
  const slots = M.slots[op.p];
  if (!slots) return;
  const slot = slots[op.s];
  if (op.t === 'draw' && slot) {
    const person = M.byId[op.w];
    if (!person) return;
    if (M.completed.length && M.completed[M.completed.length - 1] !== op.p) M.recallLocked = true;
    slot.history.push(op.w);
    slot.person = person; slot.state = 'won'; slot.redrawn = slot.history.length > 1;
    M.used.add(op.w);
  } else if (op.t === 'void' && slot && slot.state === 'won' && slot.person.id === op.w) {
    slot.state = 'void';
  } else if (op.t === 'unvoid' && slot && slot.state === 'void' && slot.person.id === op.w) {
    slot.state = 'won';
  } else if (op.t === 'complete' && !M.done[op.p]) {
    M.done[op.p] = true;
    M.completed.push(op.p);
    M.recallLocked = false;
  }
}
function addOps(ops) {
  ops.forEach(op => {
    if (!op || M.opIds.has(op.id)) return;
    M.opIds.add(op.id);
    M.ops.push(op);
    applyOp(op);
  });
}
function record(op) {
  if (!canWrite()) return null;
  const full = Sync.enqueue(op);
  addOps([full]);
  return full;
}
function canWrite() {
  if (U.blocked) return false;
  if (M.prizeChanged) { toast('獎項在鎖定後被修改，不能抽獎。請後台解除鎖定後重新鎖定。', 4000); return false; }
  if (M.versionMismatch) { toast('名單已更新，請回主頁按 F5 重新載入。', 4000); return false; }
  return true;
}

function curPrize() {
  if (U.page === 'recall') return M.prizes[M.completed[U.recallPos]];
  return M.prizes[U.cur];
}
function curIndex() { return U.page === 'recall' ? M.completed[U.recallPos] : U.cur; }
function started(i) { return M.slots[i].some(s => s.state !== 'empty'); }
// 下一個獎項：進行到一半的優先，其次是後台指定的，最後照排序
function nextPrizeIndex() {
  const inProgress = M.prizes.findIndex((p, i) => !M.done[i] && started(i));
  if (inProgress >= 0) return inProgress;
  if (U.nextPrizeName) {
    const i = M.prizes.findIndex((p, j) => p.name === U.nextPrizeName && !M.done[j]);
    if (i >= 0) return i;
  }
  return M.prizes.findIndex((p, i) => !M.done[i]);
}
function isEditable(idx) {
  return !M.recallLocked && M.completed.length > 0 && M.completed[M.completed.length - 1] === idx;
}

// ── 頁面 ───────────────────────────────────────────────
let $page = null;
let cells = [];

function go(page) {
  stopAllRolls();
  U.voidSel = null;
  U.page = page;
  const old = $page;
  $page = document.createElement('div');
  $page.className = 'page';
  const bg = page === 'home' ? ASSET.home : page === 'prize' ? ASSET.prize : ASSET.draw;
  if (bg) { $page.classList.add('has-bg'); $page.style.backgroundImage = `url("${bg}")`; }
  $page.innerHTML = buildPage();
  $stage.appendChild($page);
  if (old) { old.classList.add('out'); setTimeout(() => old.remove(), 320); }
  afterRender();
  updateStatus();
}
function buildPage() {
  if (U.page === 'home') return homeHTML();
  if (U.page === 'prize') return prizeHTML(M.prizes[U.cur]);
  if (U.page === 'draw') return drawHTML(U.cur, false);
  if (U.page === 'recall') return drawHTML(M.completed[U.recallPos], true);
  return '';
}
function homeHTML() {
  const open = U.sysState === '報到中';
  const ended = U.sysState === '已結束';
  return `
  <div class="logo-area">${ASSET.logo ? `<img src="${ASSET.logo}" alt="">` : ''}</div>
  <div class="home-title">
    <h1>${esc(cfg.title || '')}</h1>
    ${cfg.subtitle ? `<p>${esc(cfg.subtitle)}</p>` : ''}
  </div>
  ${ended ? '<div class="home-note">活動已結束</div>' : ''}
  <div class="qr-card ${open ? '' : 'off'}">
    <div class="qr"></div>
    <div class="qr-count"><span>已報到</span><b>${U.checkins}</b></div>
  </div>`;
}
function prizeHTML(p) {
  const url = p.photo && ASSET.photo[p.photo];
  const photo = url
    ? `<div class="photo"><img src="${url}" alt=""></div>`
    : `<div class="photo none"><span class="big">${p.qty}</span><span class="unit">名</span></div>`;
  return `
  ${photo}
  <div class="prize-info">
    <h2 class="item">${esc(p.name)}</h2>
    <div class="qty-line">
      <span class="qty">共<b>${p.qty}</b>名</span>
      <span class="mode-tag">${esc(p.mode)}</span>
    </div>
  </div>`;
}
function drawHTML(idx, recall) {
  const p = M.prizes[idx];
  const slots = M.slots[idx];
  const n = slots.length;
  const drawn = slots.filter(s => s.state !== 'empty').length;
  const cls = n >= 6 ? 'c2' : 'c1' + (n === 1 ? ' solo' : '');
  const right = recall ? '<span class="done-chip">已完成</span>' : `<span class="bar-prog">${drawn} / ${n}</span>`;
  const cellsHTML = slots.map((s, i) => `
    <div class="cell" data-i="${i}">
      <div class="badge">${i + 1}</div>
      <div class="win"></div>
      <span class="redo">補抽</span>
      <span class="mark">作廢</span>
    </div>`).join('');
  return `
  <header class="bar">
    <div class="bar-title">${esc(p.name)}</div>
    ${right}
  </header>
  <div class="names ${cls}" style="--rows:${Math.ceil(n / 2)}">${cellsHTML}</div>
  <div class="void-hint" hidden></div>`;
}

function labelHTML(p) {
  if (!p) return '<div class="label"></div>';
  const tag = p.tag ? `<span class="tag">${esc(p.tag)}</span>` : '';
  return `<div class="label"><span class="unit">${esc(p.unit)}</span><span class="sep">_</span><span class="nm">${esc(p.name)}</span>${tag}</div>`;
}
function fitLabel(label) {
  if (!label) return;
  const cell = label.closest('.cell');
  if (!cell) return;
  const ns = parseFloat(getComputedStyle(cell).getPropertyValue('--ns')) || 72;
  let us = ns * 0.6, nsz = ns;
  label.style.setProperty('--us', us + 'px');
  label.style.setProperty('--nsz', nsz + 'px');
  // 名字太長時，先縮單位名稱，再縮姓名
  while (label.scrollWidth > label.clientWidth && us > ns * 0.34) { us -= 2; label.style.setProperty('--us', us + 'px'); }
  while (label.scrollWidth > label.clientWidth && nsz > ns * 0.55) { nsz -= 2; label.style.setProperty('--nsz', nsz + 'px'); }
}

function afterRender() {
  cells = Array.from($page.querySelectorAll('.cell[data-i]'));
  if (U.page === 'home') renderQR();
  if (U.page === 'draw' || U.page === 'recall') {
    const idx = curIndex();
    M.slots[idx].forEach((s, i) => paintCell(i, s));
    if (U.page === 'draw' && !started(idx)) {
      const p = M.prizes[idx];
      const empties = M.slots[idx].map((s, i) => i);
      (p.mode === '一次抽完' ? empties : [0]).forEach(i => startRoll(cells[i]));
    }
  }
}
function paintCell(i, s) {
  const cell = cells[i];
  if (!cell) return;
  cell.classList.remove('rolling', 'won', 'void', 'landed', 'pickable', 'selected', 'redrawn');
  const win = cell.querySelector('.win');
  if (s.state === 'empty') { win.innerHTML = ''; return; }
  cell.classList.add(s.state);
  if (s.redrawn) cell.classList.add('redrawn');
  win.innerHTML = labelHTML(s.person);
  fitLabel(win.querySelector('.label'));
}
function updateProgress() {
  const el = $page && $page.querySelector('.bar-prog');
  if (!el) return;
  const slots = M.slots[curIndex()];
  el.textContent = `${slots.filter(s => s.state !== 'empty').length} / ${slots.length}`;
}

// ── QR code（本機產生）────────────────────────────────
function renderQR() {
  const box = ($page && $page.querySelector('.qr'));
  if (!box || typeof qrcode !== 'function') return;
  const url = new URL('../checkin/?e=' + encodeURIComponent(E), location.href).href;
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  const n = qr.getModuleCount(), quiet = 2, cell = Math.floor(256 / (n + quiet * 2));
  const c = document.createElement('canvas');
  c.width = c.height = cell * (n + quiet * 2);
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#333';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
  box.innerHTML = '';
  box.appendChild(c);
}

// ── 拉霸動畫 ───────────────────────────────────────────
function reelStyle() { return ['A', 'B', 'C'].indexOf(cfg.theme.reel) >= 0 ? cfg.theme.reel : 'A'; }
function stopAllRolls() {
  cells.forEach(c => { clearInterval(c._timer); clearTimeout(c._t2); c._rolling = false; });
}
function startRoll(cell) {
  if (!cell) return;
  clearInterval(cell._timer);
  cell._rolling = true;
  cell.classList.remove('won', 'void', 'landed');
  cell.classList.add('rolling');
  const win = cell.querySelector('.win');
  const style = reelStyle();
  if (REDUCED) { win.innerHTML = '<div class="label"><span class="nm">…</span></div>'; return; }
  if (style === 'A') {
    win.innerHTML = labelHTML(rollName());
    cell._timer = setInterval(() => {
      win.innerHTML = labelHTML(rollName());
      const l = win.firstElementChild;
      if (l) l.style.transform = `translateY(${(Math.random() * 12 - 6).toFixed(1)}px)`;
    }, 50);
  } else if (style === 'B') {
    const names = Array.from({ length: 12 }, rollName);
    const rows = names.concat(names).map(p => `<div class="row">${labelHTML(p)}</div>`).join('');
    win.innerHTML = `<div class="reel"><div class="strip loop">${rows}</div></div>`;
  } else {
    win.innerHTML = '<div class="flip"><div class="face front">？</div><div class="face back"></div></div>';
  }
}
function land(cell, person, redrawn) {
  clearInterval(cell._timer);
  cell._rolling = false;
  const win = cell.querySelector('.win');
  win.innerHTML = labelHTML(person);
  cell.classList.remove('rolling');
  cell.classList.add('won');
  cell.classList.toggle('redrawn', !!redrawn);
  fitLabel(win.querySelector('.label'));
  if (REDUCED) { win.firstElementChild.classList.add('fadein'); return; }
  void cell.offsetWidth;
  cell.classList.add('landed');
}
function stopRoll(cell, person, redrawn) {
  return new Promise(resolve => {
    const win = cell.querySelector('.win');
    const style = reelStyle();
    const done = () => { land(cell, person, redrawn); setTimeout(resolve, REDUCED ? 60 : 340); };
    if (REDUCED) { done(); return; }
    if (style === 'A') {
      clearInterval(cell._timer);
      const delays = [];
      let d = 50, t = 0;
      while (t < 1900) { delays.push(d); t += d; d = Math.min(400, d * 1.16); }
      let k = 0;
      const step = () => {
        if (k >= delays.length) { done(); return; }
        win.innerHTML = labelHTML(rollName());
        cell._t2 = setTimeout(step, delays[k++]);
      };
      step();
    } else if (style === 'B') {
      const h = cell.getBoundingClientRect().height / (parseFloat($stage.dataset.s) || 1);
      const count = 22;
      const rows = Array.from({ length: count }, rollName).concat([person])
        .map(p => `<div class="row">${labelHTML(p)}</div>`).join('');
      win.innerHTML = `<div class="reel"><div class="strip">${rows}</div></div>`;
      const strip = win.querySelector('.strip');
      strip.style.transform = 'translateY(0)';
      void strip.offsetWidth;
      strip.style.transition = 'transform 2500ms cubic-bezier(.15,.8,.3,1.06)';
      strip.style.transform = `translateY(${-count * h}px)`;
      let finished = false;
      const fin = () => { if (!finished) { finished = true; done(); } };
      strip.addEventListener('transitionend', fin, { once: true });
      setTimeout(fin, 2700);
    } else {
      let flip = win.querySelector('.flip');
      if (!flip) {
        win.innerHTML = '<div class="flip"><div class="face front">？</div><div class="face back"></div></div>';
        flip = win.querySelector('.flip');
      }
      flip.querySelector('.back').innerHTML = labelHTML(person);
      fitLabel(flip.querySelector('.back .label'));
      void flip.offsetWidth;
      flip.classList.add('on');
      setTimeout(done, 640);
    }
  });
}
async function rollAndStop(cell, person, redrawn) {
  if (!cell._rolling) { startRoll(cell); await sleep(REDUCED ? 0 : 450); }
  await stopRoll(cell, person, redrawn);
}
async function busy(fn) {
  U.busy++;
  try { await fn(); } finally { U.busy--; }
}

// ── 抽獎流程 ───────────────────────────────────────────
function notEnough() { toast('抽獎池人數不夠，請通知後台。', 4000); }

async function redraw(idx, i) {
  if (!available().length) { notEnough(); return; }
  if (!canWrite()) return;
  const person = pick(1)[0];
  record({ t: 'draw', p: idx, s: i, w: person.id, r: 1 });
  await busy(() => rollAndStop(cells[i], person, true));
  updateProgress();
}
async function drawNext(idx) {
  const p = M.prizes[idx];
  const slots = M.slots[idx];
  const voidIdx = slots.findIndex(s => s.state === 'void');
  if (voidIdx >= 0) return redraw(idx, voidIdx);
  const empties = slots.map((s, i) => s.state === 'empty' ? i : -1).filter(i => i >= 0);
  if (!empties.length) {
    if (!M.done[idx]) record({ t: 'complete', p: idx });
    go('home');
    return;
  }
  const n = p.mode === '一次抽完' ? empties.length : 1;
  if (available().length < n) { notEnough(); return; }
  if (!canWrite()) return;
  // 按下的瞬間決定結果、寫入本機並送出，之後的動畫只是呈現
  const winners = pick(n);
  winners.forEach((w, k) => record({ t: 'draw', p: idx, s: empties[k], w: w.id }));
  await busy(async () => {
    if (n > 1) {
      empties.forEach(i => { if (!cells[i]._rolling) startRoll(cells[i]); });
      await Promise.all(empties.map((i, k) => sleep(k * 500).then(() => stopRoll(cells[i], winners[k], false).then(updateProgress))));
    } else {
      await rollAndStop(cells[empties[0]], winners[0], false);
      updateProgress();
    }
  });
}

function next() {
  if (U.page === 'home') {
    if (!M.loaded) { toast(U.sysState === '已鎖定' || U.sysState === '抽獎中' ? '名單載入中，請稍候' : '後台鎖定名單後才能開始抽獎'); return; }
    const i = nextPrizeIndex();
    if (i < 0) { toast('所有獎項都已抽完'); return; }
    U.cur = i; go('prize');
  } else if (U.page === 'prize') {
    go('draw');
  } else if (U.page === 'draw') {
    drawNext(U.cur);
  } else if (U.page === 'recall') {
    const idx = M.completed[U.recallPos];
    const v = M.slots[idx].findIndex(s => s.state === 'void');
    if (isEditable(idx) && v >= 0) { redraw(idx, v); return; }
    if (U.recallPos < M.completed.length - 1) { U.recallPos++; go('recall'); } else go('home');
  }
}
function prev() {
  if (U.page === 'home') {
    if (!M.completed.length) return;
    U.recallPos = M.completed.length - 1; go('recall');
  } else if (U.page === 'prize') {
    go('home');
  } else if (U.page === 'draw') {
    if (!started(U.cur)) go('prize');
  } else if (U.page === 'recall') {
    if (U.recallPos > 0) { U.recallPos--; go('recall'); }
  }
}

// ── 作廢 ───────────────────────────────────────────────
function canVoidHere() {
  if (U.page === 'draw') return true;
  if (U.page === 'recall') return isEditable(M.completed[U.recallPos]);
  return false;
}
function pickableSlots() {
  return M.slots[curIndex()].map((s, i) => (s.state === 'won' || s.state === 'void') ? i : -1).filter(i => i >= 0);
}
function startVoid() {
  if (!canVoidHere()) {
    if (U.page === 'recall') toast('這個獎項已經不能作廢（下一個獎項已開抽）');
    return;
  }
  const list = pickableSlots();
  if (!list.length) return;
  U.voidSel = { slot: null };
  list.forEach(i => cells[i].classList.add('pickable'));
  setHint('選擇要作廢的格子：按數字鍵（0＝第 10 格），Esc 取消');
  if (list.length === 1) selectSlot(list[0]);
}
function selectSlot(i) {
  if (!U.voidSel || pickableSlots().indexOf(i) < 0) return;
  cells.forEach(c => c.classList.remove('selected'));
  cells[i].classList.add('selected');
  U.voidSel.slot = i;
  const s = M.slots[curIndex()][i];
  const who = `${s.person.unit}_${s.person.name}`;
  setHint(s.state === 'won'
    ? `作廢第 ${i + 1} 格：${who}？Enter 確認／Esc 取消`
    : `取消作廢第 ${i + 1} 格：${who}，恢復為得獎人？Enter 確認／Esc 取消`);
}
function confirmVoid() {
  if (!U.voidSel || U.voidSel.slot == null) return;
  const i = U.voidSel.slot;
  const idx = curIndex();
  const s = M.slots[idx][i];
  endVoid();
  if (!record({ t: s.state === 'won' ? 'void' : 'unvoid', p: idx, s: i, w: s.person.id })) return;
  paintCell(i, s);
}
function endVoid() {
  U.voidSel = null;
  cells.forEach(c => c.classList.remove('pickable', 'selected'));
  setHint('');
}
function setHint(t) {
  const h = ($page && $page.querySelector('.void-hint'));
  if (!h) return;
  h.textContent = t; h.hidden = !t;
}

// ── 狀態列、阻擋畫面 ─────────────────────────────────
function updateStatus() {
  const st = Sync.status();
  const a = U.assets;
  const assets = !M.loaded ? '素材：鎖定後載入' : a.done + a.failed < a.total ? `素材載入中 ${a.done}/${a.total}` : a.failed ? `素材已就緒（${a.failed} 張失敗）` : '素材已就緒 ✓';
  $status.textContent = `前台代號 ${st.code}｜名單版本 ${M.version || '—'}｜待同步 ${st.pending}｜${assets}｜${PALETTES[cfg.theme.palette] || ''}・拉霸 ${reelStyle()}｜${PAGE_NAMES[U.page]}`;
  $status.hidden = !U.help;
  $sync.hidden = !st.pending && st.online;
  $sync.textContent = !st.online ? `離線中，待同步 ${st.pending} 筆` : `待同步 ${st.pending} 筆`;
  const warn = M.prizeChanged ? '獎項在鎖定後被修改：請後台「解除鎖定」後重新鎖定，再按 F5 重新載入'
    : M.versionMismatch ? '名單已更新：請回到主頁按 F5 重新載入'
    : st.lastError || '';
  $banner.textContent = warn; $banner.hidden = !warn;
}
function block(kind, data) {
  U.blocked = kind;
  if (!kind) { $blocker.hidden = true; return; }
  endVoid();
  if (kind === 'notActive') {
    const pending = Sync.status().pending;
    $blocker.innerHTML = `<div><h2>另一台前台作用中</h2><p>要由這台接手，請後台按「摸彩系統 › 活動當天 › 強制切換前台」，輸入接手代號：</p>
      <div class="code">${esc(Sync.code)}</div>
      ${pending ? `<p>⚠️ 這台還有 ${pending} 筆抽獎結果沒有寫進 Sheet，請通知後台以台下結果人工核對。</p>` : ''}</div>`;
  } else if (kind === 'badKey') {
    $blocker.innerHTML = '<div><h2>前台連結已失效</h2><p>請向後台索取新的前台專屬連結（摸彩系統 › 活動前 › 產生連結）。</p></div>';
  } else if (kind === 'badLink') {
    $blocker.innerHTML = '<div><h2>連結不完整</h2><p>請用 Sheet「摸彩系統 › 活動前 › 產生連結」裡的前台專屬連結開啟。</p></div>';
  } else if (kind === 'apiVersion') {
    $blocker.innerHTML = `<div><h2>前台版本與這場活動不相容</h2><p>此活動需使用 /v${esc(data)}/ 網址。</p></div>`;
  }
  $blocker.hidden = false;
}

// ── 載入 ───────────────────────────────────────────────
async function loadConfig() {
  for (let i = 0; i < 5; i++) {
    try {
      const r = await (await fetch(API + '?a=config')).json();
      if (r.ok) return r;
    } catch (err) { /* 重試 */ }
    await sleep(2000 * (i + 1));
  }
  return null;
}
function applyTheme(c) {
  const root = document.documentElement;
  const t = c.theme || {};
  if (t.palette && t.palette !== 'strawberry') root.dataset.palette = t.palette;
  const map = { primary: '--primary', secondary: '--secondary', bg: '--bg', ink: '--ink' };
  Object.keys(map).forEach(k => { if (t.colors && t.colors[k]) root.style.setProperty(map[k], t.colors[k]); });
  const font = (t.font || 'Huninn').replace(/"/g, '');
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(font).replace(/%20/g, '+') + '&display=swap';
  document.head.appendChild(link);
  root.style.setProperty('--f-display', `"${font}", "Noto Sans TC", "Microsoft JhengHei", sans-serif`);
  if (c.title) document.title = c.title + '｜前台';
}

let loading = false;
async function loadDraw() {
  if (loading) return;
  loading = true;
  try {
    let r = null;
    try { r = await Sync.load(); } catch (err) {
      const cached = Sync.cachedLoad();
      if (cached) { r = cached; toast('目前離線，先用上次載入的名單，連線後自動補寫', 4000); }
    }
    if (!r) { setTimeout(() => { loading = false; loadDraw(); }, 5000); return; }
    if (!r.ok) { if (r.code === 'badKey') block('badKey'); return; }
    if (!r.ready) return;
    Sync.resetForVersion(r.version);
    M.version = r.version;
    M.prizeChanged = !!r.prizeChanged;
    M.versionMismatch = false;
    M.prizes = r.prizes;
    M.people = r.pool.map(x => ({ id: x.id, unit: x.unit, name: x.name, tag: x.display.slice((x.unit + '_' + x.name).length) }));
    M.byId = {};
    M.people.forEach(p => { M.byId[p.id] = p; });
    M.ops = []; M.opIds = new Set();
    resetModel();
    addOps(r.ops);
    addOps(Sync.pendingOps());
    M.loaded = true;
    if (U.page !== 'home' && !U.busy) go('home');
    updateStatus();
    loadAssets(r.assets || []);
  } finally {
    loading = false;
  }
}
// 逐張下載素材，失敗只重試那一張
async function loadAssets(list) {
  U.assets = { total: list.length, done: 0, failed: 0 };
  updateStatus();
  for (const a of list) {
    const r = await Sync.asset(a.id);
    if (r && r.data) {
      const bytes = Uint8Array.from(atob(r.data), c => c.charCodeAt(0));
      const url = URL.createObjectURL(new Blob([bytes], { type: r.mime }));
      if (a.role.indexOf('photo:') === 0) ASSET.photo[a.role.slice(6)] = url;
      else ASSET[a.role] = url;
      await new Promise(res => { const img = new Image(); img.onload = img.onerror = res; img.src = url; });
      U.assets.done++;
    } else {
      U.assets.failed++;
    }
    updateStatus();
  }
  if (U.page === 'home' && !U.busy) go('home');
}

function onBeat(r) {
  if (r.rejected) { updateStatus(); return; }
  if (!r.ok) { if (r.code === 'badKey') block('badKey'); return; }
  if (r.apiVersion && r.apiVersion !== 1) { block('apiVersion', r.apiVersion); return; }
  const wasState = U.sysState;
  U.sysState = r.state;
  if (r.active === false) { if (U.blocked !== 'notActive') block('notActive'); return; }
  if (U.blocked === 'notActive') { block(''); M.loaded = false; loadDraw(); }

  if (typeof r.checkins === 'number') {
    U.checkins = r.checkins;
    const el = ($page && $page.querySelector('.qr-count b'));
    if (el) el.textContent = r.checkins;
  }
  if (wasState !== r.state && U.page === 'home' && !U.busy) go('home');
  const drawable = r.state === '已鎖定' || r.state === '抽獎中';
  // 後台解除鎖定時放下已載入的名單，重新鎖定後再載入新版本
  if (!drawable && M.loaded && r.state !== '已結束') { M.loaded = false; if (!U.busy) go('home'); }
  if (drawable && !M.loaded) loadDraw();
  if (M.loaded && r.version && r.version !== M.version) M.versionMismatch = true;
  if (M.loaded && r.prizeChanged) M.prizeChanged = true;
  U.nextPrizeName = r.nextPrize || '';

  // 第一次回報只記下目前的值當基準（略過開啟前就送出的指令），之後有變化才執行
  const handled = Sync.recall('forceHome', null);
  if (handled === null) Sync.remember('forceHome', r.forceHome || 0);
  else if (r.forceHome > handled && !U.busy) {
    Sync.remember('forceHome', r.forceHome);
    toast('後台要求回到主頁');
    go('home');
  }
  updateStatus();
}

// ── 輸入（只用鍵盤）──────────────────────────────────
function toggleHelp() { U.help = !U.help; $help.hidden = !U.help; updateStatus(); }
function toggleBlack() { U.black = !U.black; $black.hidden = !U.black; }
function fullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => toast('這個視窗不允許全螢幕'));
  } catch (e) { toast('這個視窗不允許全螢幕'); }
}

window.addEventListener('keydown', e => {
  const k = e.key;
  // 抽獎頁與回看頁攔截重新整理
  if ((k === 'F5' || ((e.ctrlKey || e.metaKey) && (k === 'r' || k === 'R'))) && (U.page === 'draw' || U.page === 'recall')) {
    e.preventDefault(); toast('抽獎頁不能重新整理，請先回到主頁'); return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === '?' || k === '/') { e.preventDefault(); toggleHelp(); return; }
  if (k === 'f' || k === 'F') { fullscreen(); return; }
  if (U.blocked) return;
  if (k === 'b' || k === 'B') { toggleBlack(); return; }
  if (U.black || U.busy) { if ([' ', 'ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp'].indexOf(k) >= 0) e.preventDefault(); return; }
  if (U.voidSel) {
    e.preventDefault();
    if (/^[0-9]$/.test(k)) selectSlot(k === '0' ? 9 : Number(k) - 1);
    else if (k === 'Enter') confirmVoid();
    else if (k === 'Escape') endVoid();
    return;
  }
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (k === 'x' || k === 'X') startVoid();
});

// 視窗失去鍵盤焦點時，角落顯示小提示點
function focusCheck() { $focusDot.hidden = document.hasFocus(); }
window.addEventListener('focus', focusCheck);
window.addEventListener('blur', focusCheck);

// 螢幕常亮（不支援就略過）
async function wake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) { /* 略過 */ }
}
document.addEventListener('visibilitychange', wake);

// ── 啟動 ───────────────────────────────────────────────
async function start() {
  window.addEventListener('resize', scale);
  scale();
  focusCheck();
  wake();
  if (!/^[\w-]{20,}$/.test(E) || !K) { block('badLink'); return; }
  Sync.on('status', updateStatus);
  Sync.on('beat', onBeat);
  go('home');
  const c = await loadConfig();
  if (c) {
    if (c.apiVersion !== 1) { block('apiVersion', c.apiVersion); return; }
    cfg = { title: c.title || '', subtitle: c.subtitle || '', theme: c.theme || {} };
    U.sysState = c.state;
    applyTheme(cfg);
    go('home');
  }
  Sync.start();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if ($page) $page.querySelectorAll('.label').forEach(fitLabel); });
}
start();
})();
</script>
